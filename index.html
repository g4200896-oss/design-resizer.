<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Remove + 4500x5400</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1115; color: #e8e8ea;
    display: flex; flex-direction: column; align-items: center; padding: 30px 16px; }
  h1 { font-size: 22px; margin: 0 0 20px; text-align: center; }
  .drop { width: 100%; max-width: 480px; border: 2px dashed #3a3f4b; border-radius: 14px; padding: 40px 20px;
    text-align: center; cursor: pointer; font-size: 17px; }
  .drop.over { border-color: #4f8cff; background: #1b2233; }
  .drop strong { color: #4f8cff; }
  #status { margin: 18px 0; font-size: 15px; color: #9aa0a6; min-height: 20px; text-align: center; }
  .preview { width: 100%; max-width: 360px; aspect-ratio: 4500 / 5400; border-radius: 12px; overflow: hidden;
    background-color: #fff;
    background-image: linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);
    background-size: 20px 20px; background-position: 0 0,0 10px,10px -10px,-10px 0; }
  .preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
  button { margin-top: 18px; background: #4f8cff; color: #fff; border: 0; border-radius: 10px; padding: 14px 32px;
    font-size: 17px; font-weight: 600; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1>Background Remove + 4500 × 5400</h1>

  <div class="drop" id="drop">
    <strong>1. Design upload karein</strong><br>
    <span style="font-size:14px;color:#9aa0a6">(click karein ya file yahan drag karein)</span>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <div id="status"></div>

  <div class="preview hidden" id="preview"><img id="previewImg" alt=""></div>
  <button id="downloadBtn" class="hidden">2. Download PNG</button>

<script type="module">
  const OUT_W = 4500, OUT_H = 5400, PADDING = 0.03;
  const BG_LIB = "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";

  const drop = document.getElementById("drop");
  const fileInput = document.getElementById("fileInput");
  const statusEl = document.getElementById("status");
  const preview = document.getElementById("preview");
  const previewImg = document.getElementById("previewImg");
  const downloadBtn = document.getElementById("downloadBtn");

  let lib = null, outBlob = null, outName = "design_4500x5400.png", busy = false;

  drop.addEventListener("click", () => !busy && fileInput.click());
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault(); drop.classList.remove("over");
    if (e.dataTransfer.files[0]) run(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", () => { if (fileInput.files[0]) run(fileInput.files[0]); fileInput.value = ""; });

  downloadBtn.addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(outBlob);
    a.download = outName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  function loadImage(blob) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = rej;
      img.src = url;
    });
  }

  function toCanvas(img) {
    const c = document.createElement("canvas");
    c.width = img.naturalWidth || img.width;
    c.height = img.naturalHeight || img.height;
    c.getContext("2d").drawImage(img, 0, 0);
    return c;
  }

  // ---------- Kya background saada (ek rang) hai? ----------
  // Kinaron ke pixels check karo. 85%+ ek jaise hon to saada background.
  function detectSolidBg(d, w, h) {
    const samples = [];
    const step = Math.max(1, Math.floor(Math.max(w, h) / 300));
    for (let x = 0; x < w; x += step) { samples.push(x, (h - 1) * w + x); }
    for (let y = 0; y < h; y += step) { samples.push(y * w, y * w + w - 1); }

    // Pehle se transparent background?
    let transparent = 0;
    for (const p of samples) if (d[p * 4 + 3] < 20) transparent++;
    if (transparent / samples.length > 0.85) return { type: "transparent" };

    // Median color
    const ch = [[], [], []];
    for (const p of samples) for (let k = 0; k < 3; k++) ch[k].push(d[p * 4 + k]);
    const bg = ch.map(a => a.sort((m, n) => m - n)[a.length >> 1]);
    let close = 0;
    for (const p of samples) {
      const i = p * 4;
      const dist = Math.hypot(d[i] - bg[0], d[i + 1] - bg[1], d[i + 2] - bg[2]);
      if (dist < 40) close++;
    }
    if (close / samples.length > 0.85) return { type: "solid", bg };
    return { type: "complex" };
  }

  // ---------- Saada background hatao (kinaron se flood fill) ----------
  // Smooth edges ke saath + edge se background ka rang saaf (white halo nahi aata)
  function removeSolidBg(d, w, h, bg) {
    const HARD = 28, SOFT = 90;           // HARD tak = poora transparent, HARD..SOFT = smooth edge
    const visited = new Uint8Array(w * h);
    const stack = [];
    for (let x = 0; x < w; x++) stack.push(x, (h - 1) * w + x);
    for (let y = 0; y < h; y++) stack.push(y * w, y * w + w - 1);

    while (stack.length) {
      const p = stack.pop();
      if (visited[p]) continue;
      visited[p] = 1;
      const i = p * 4;
      const dist = Math.hypot(d[i] - bg[0], d[i + 1] - bg[1], d[i + 2] - bg[2]);
      if (dist > SOFT) continue;          // design ka pixel — chhor do

      if (dist <= HARD) {
        d[i + 3] = 0;
      } else {
        // Edge pixel: alpha nikalo aur background ka rang mix se hatao
        const a = (dist - HARD) / (SOFT - HARD);
        for (let k = 0; k < 3; k++) {
          const v = (d[i + k] - bg[k] * (1 - a)) / a;
          d[i + k] = Math.max(0, Math.min(255, Math.round(v)));
        }
        d[i + 3] = Math.round(d[i + 3] * a);
        continue;                         // edge par ruk jao, andar na jao
      }
      const x = p % w, y = (p / w) | 0;
      if (x > 0) stack.push(p - 1);
      if (x < w - 1) stack.push(p + 1);
      if (y > 0) stack.push(p - w);
      if (y < h - 1) stack.push(p + w);
    }

    // Design ke andar band hisse (jaise "O", "A" ke andar) jo bilkul background rang hain
    // aur kaafi bare hain, unhein bhi transparent karo. Chhote hisse (aankh ki chamak waghera) safe.
    const minArea = Math.max(400, Math.floor(w * h * 0.0004));
    const seen = new Uint8Array(w * h);
    for (let p = 0; p < w * h; p++) {
      if (seen[p] || d[p * 4 + 3] === 0) continue;
      const i0 = p * 4;
      if (Math.hypot(d[i0] - bg[0], d[i0 + 1] - bg[1], d[i0 + 2] - bg[2]) > HARD) { seen[p] = 1; continue; }
      const region = [];
      const st = [p];
      seen[p] = 1;
      while (st.length) {
        const q = st.pop();
        region.push(q);
        const x = q % w, y = (q / w) | 0;
        const nb = [x > 0 ? q - 1 : -1, x < w - 1 ? q + 1 : -1, y > 0 ? q - w : -1, y < h - 1 ? q + w : -1];
        for (const n of nb) {
          if (n < 0 || seen[n] || d[n * 4 + 3] === 0) continue;
          const j = n * 4;
          if (Math.hypot(d[j] - bg[0], d[j + 1] - bg[1], d[j + 2] - bg[2]) <= HARD) { seen[n] = 1; st.push(n); }
        }
      }
      if (region.length >= minArea) for (const q of region) d[q * 4 + 3] = 0;
    }
  }

  // ---------- Khali kinare kaato ----------
  function trim(c) {
    const w = c.width, h = c.height, d = c.getContext("2d").getImageData(0, 0, w, h).data;
    let top = h, left = w, right = -1, bottom = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 10) {
        if (x < left) left = x; if (x > right) right = x;
        if (y < top) top = y; if (y > bottom) bottom = y;
      }
    }
    if (right < 0) return c;
    const out = document.createElement("canvas");
    out.width = right - left + 1; out.height = bottom - top + 1;
    out.getContext("2d").drawImage(c, left, top, out.width, out.height, 0, 0, out.width, out.height);
    return out;
  }

  // ---------- 4500x5400 transparent canvas par center ----------
  function fit(src) {
    const out = document.createElement("canvas");
    out.width = OUT_W; out.height = OUT_H;
    const ctx = out.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    const pad = OUT_W * PADDING;
    const scale = Math.min((OUT_W - pad * 2) / src.width, (OUT_H - pad * 2) / src.height);
    const dw = src.width * scale, dh = src.height * scale;
    ctx.drawImage(src, (OUT_W - dw) / 2, (OUT_H - dh) / 2, dw, dh);
    return new Promise((res) => out.toBlob(res, "image/png"));
  }

  async function aiRemove(file) {
    if (!lib) {
      statusEl.textContent = "Pehli dafa AI load ho raha hai, 1-2 minute wait karein...";
      lib = await import(BG_LIB);
    }
    statusEl.textContent = "AI se background remove ho raha hai...";
    const blob = await lib.removeBackground(file, {
      model: "isnet",
      output: { format: "image/png" },
      progress: (key, cur, tot) => {
        if (key.startsWith("fetch") && tot) statusEl.textContent = `Pehli dafa AI load ho raha hai: ${Math.round(cur / tot * 100)}%`;
      }
    });
    return toCanvas(await loadImage(blob));
  }

  async function run(file) {
    if (!file.type.startsWith("image/")) return;
    busy = true;
    preview.classList.add("hidden");
    downloadBtn.classList.add("hidden");
    try {
      statusEl.textContent = "Design check ho raha hai...";
      let canvas = toCanvas(await loadImage(file));
      const ctx = canvas.getContext("2d");
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const bgInfo = detectSolidBg(imgData.data, canvas.width, canvas.height);

      if (bgInfo.type === "solid") {
        statusEl.textContent = "Background remove ho raha hai...";
        await new Promise(r => setTimeout(r, 30));
        removeSolidBg(imgData.data, canvas.width, canvas.height, bgInfo.bg);
        ctx.putImageData(imgData, 0, 0);
      } else if (bgInfo.type === "complex") {
        canvas = await aiRemove(file);
      }
      // "transparent" = pehle se saaf, kuch na karo

      statusEl.textContent = "4500 × 5400 bana raha hai...";
      await new Promise(r => setTimeout(r, 30));
      outBlob = await fit(trim(canvas));
      outName = file.name.replace(/\.[^.]+$/, "") + "_4500x5400.png";
      if (previewImg.src) URL.revokeObjectURL(previewImg.src);
      previewImg.src = URL.createObjectURL(outBlob);
      preview.classList.remove("hidden");
      downloadBtn.classList.remove("hidden");
      statusEl.textContent = "Tayyar hai ✔";
    } catch (err) {
      console.error(err);
      statusEl.textContent = "Error aa gaya, dobara try karein: " + (err.message || err);
    }
    busy = false;
  }
</script>
</body>
</html>
