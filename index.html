<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Remove + 4500x5400</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1115; color: #e8e8ea;
    display: flex; flex-direction: column; align-items: center; padding: 30px 16px; }
  h1 { font-size: 22px; margin: 0 0 20px; text-align: center; }
  .drop { width: 100%; max-width: 480px; border: 2px dashed #3a3f4b; border-radius: 14px; padding: 40px 20px;
    text-align: center; cursor: pointer; font-size: 17px; }
  .drop.over { border-color: #4f8cff; background: #1b2233; }
  .drop strong { color: #4f8cff; }
  #status { margin: 18px 0; font-size: 15px; color: #9aa0a6; min-height: 20px; text-align: center; }
  .preview { width: 100%; max-width: 360px; aspect-ratio: 4500 / 5400; border-radius: 12px; overflow: hidden;
    background-color: #fff;
    background-image: linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);
    background-size: 20px 20px; background-position: 0 0,0 10px,10px -10px,-10px 0; }
  .preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
  button { margin-top: 18px; background: #4f8cff; color: #fff; border: 0; border-radius: 10px; padding: 14px 32px;
    font-size: 17px; font-weight: 600; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1>Background Remove + 4500 × 5400</h1>

  <div class="drop" id="drop">
    <strong>1. Design upload karein</strong><br>
    <span style="font-size:14px;color:#9aa0a6">(click karein ya file yahan drag karein)</span>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <div id="status"></div>

  <div class="preview hidden" id="preview"><img id="previewImg" alt=""></div>
  <button id="downloadBtn" class="hidden">2. Download PNG</button>

<script type="module">
  const OUT_W = 4500, OUT_H = 5400, PADDING = 0.03;
  const BG_LIB = "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";

  const drop = document.getElementById("drop");
  const fileInput = document.getElementById("fileInput");
  const statusEl = document.getElementById("status");
  const preview = document.getElementById("preview");
  const previewImg = document.getElementById("previewImg");
  const downloadBtn = document.getElementById("downloadBtn");

  let lib = null, outBlob = null, outName = "design_4500x5400.png", busy = false;

  drop.addEventListener("click", () => !busy && fileInput.click());
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault(); drop.classList.remove("over");
    if (e.dataTransfer.files[0]) run(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", () => { if (fileInput.files[0]) run(fileInput.files[0]); fileInput.value = ""; });

  downloadBtn.addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(outBlob);
    a.download = outName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  function loadImage(blob) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = rej;
      img.src = url;
    });
  }

  // Transparent khali kinare kaat do
  function trim(img) {
    const c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const w = c.width, h = c.height, d = ctx.getImageData(0, 0, w, h).data;
    let top = h, left = w, right = -1, bottom = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 8) {
        if (x < left) left = x; if (x > right) right = x;
        if (y < top) top = y; if (y > bottom) bottom = y;
      }
    }
    if (right < 0) return c;
    const out = document.createElement("canvas");
    out.width = right - left + 1; out.height = bottom - top + 1;
    out.getContext("2d").drawImage(c, left, top, out.width, out.height, 0, 0, out.width, out.height);
    return out;
  }

  // 4500x5400 transparent canvas par center mein fit karo
  function fit(src) {
    const out = document.createElement("canvas");
    out.width = OUT_W; out.height = OUT_H;
    const ctx = out.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    const pad = OUT_W * PADDING;
    const scale = Math.min((OUT_W - pad * 2) / src.width, (OUT_H - pad * 2) / src.height);
    const dw = src.width * scale, dh = src.height * scale;
    ctx.drawImage(src, (OUT_W - dw) / 2, (OUT_H - dh) / 2, dw, dh);
    return new Promise((res) => out.toBlob(res, "image/png"));
  }

  async function run(file) {
    if (!file.type.startsWith("image/")) return;
    busy = true;
    preview.classList.add("hidden");
    downloadBtn.classList.add("hidden");
    try {
      if (!lib) {
        statusEl.textContent = "Pehli dafa load ho raha hai, 1-2 minute wait karein...";
        lib = await import(BG_LIB);
      }
      statusEl.textContent = "Background remove ho raha hai...";
      const noBg = await lib.removeBackground(file, {
        output: { format: "image/png" },
        progress: (key, cur, tot) => {
          if (key.startsWith("fetch") && tot) statusEl.textContent = `Pehli dafa load ho raha hai: ${Math.round(cur / tot * 100)}%`;
        }
      });
      statusEl.textContent = "4500 × 5400 bana raha hai...";
      outBlob = await fit(trim(await loadImage(noBg)));
      outName = file.name.replace(/\.[^.]+$/, "") + "_4500x5400.png";
      if (previewImg.src) URL.revokeObjectURL(previewImg.src);
      previewImg.src = URL.createObjectURL(outBlob);
      preview.classList.remove("hidden");
      downloadBtn.classList.remove("hidden");
      statusEl.textContent = "Tayyar hai ✔";
    } catch (err) {
      console.error(err);
      statusEl.textContent = "Error aa gaya, dobara try karein: " + (err.message || err);
    }
    busy = false;
  }
</script>
</body>
</html>
